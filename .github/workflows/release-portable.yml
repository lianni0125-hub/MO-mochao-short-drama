name: Build Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "version.json ($version) 与标签 ${{ github.ref_name }} 不一致" }
      - name: Run tests
        run: npm test
      - name: Build portable package
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $asset = "dist/MO-mochao-Windows-v$version.zip"
          $checksum = "$asset.sha256"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" $asset $checksum --clobber
          } else {
            gh release create "v$version" $asset $checksum --title "墨潮 v$version" --generate-notes
          }
